name: News AI Digest Publisher

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v5

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Публикация новости
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Сохранение истории публикации
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_history.json
          git commit -m "update: published history [skip ci]" || exit 0
          git push
